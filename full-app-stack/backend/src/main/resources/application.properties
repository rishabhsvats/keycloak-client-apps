# Application
quarkus.application.name=task-backend-api

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# OIDC/Keycloak configuration - Resource Server mode
quarkus.oidc.auth-server-url=http://localhost:8180/realms/taskmanager
quarkus.oidc.client-id=task-backend-api
quarkus.oidc.application-type=service
quarkus.oidc.tls.verification=none
quarkus.oidc.token.issuer=http://localhost:8180/realms/taskmanager

# Role mapping from token
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Accept tokens from multiple frontend clients
quarkus.oidc.token.verify-audience=false

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=taskmanager
quarkus.datasource.password=taskmanager123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/taskmanager
quarkus.datasource.jdbc.max-size=16

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true

# Logging
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.taskmanager".level=DEBUG
quarkus.log.category."io.quarkus.oidc".level=DEBUG
